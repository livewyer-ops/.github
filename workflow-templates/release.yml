name: Create Github Release

# Controls when the workflow will run
on:
  # Triggers the workflow when a tag matching a regex is pushed
  push:
    tags:
      - "**"

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  create-release:
    uses: livewyer-ops/gh-workflows/.github/workflows/release.yaml@main
